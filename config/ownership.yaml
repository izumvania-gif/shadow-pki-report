# Разметка принадлежности — трёхуровневая (требования, п. 2.3).
#
# ЭТО ГИПОТЕЗЫ, А НЕ ГОТОВЫЕ ПРАВИЛА. По плану способ фильтрации
# определяется по факту: продакт прогоняет калибровочные домены, руками
# разбирает выгрузку и уточняет этот файл. До первого живого прогона
# считать содержимое ниже проверенным нельзя.
#
# Уровни:
#   own      — принадлежность подтверждена, идёт в отчёт автоматически
#   foreign  — атрибутировано внешнему владельцу, исключается с причиной
#   unknown  — правило не сработало, выносится на ручное подтверждение
#
# Умолчание — unknown. Молча выкидывать нельзя: исключённое сохраняется
# с причиной, чтобы можно было проверить, не выкинули ли лишнего.
version: 1
default_level: unknown

own:
  # Корневые домены компании задаются на запуск, здесь — калибровочные.
  root_domains:
    - rutoken.ru
    - guardant.ru
    - aktiv-company.ru      # ПРОВЕРИТЬ точный домен Актив на этапе 0
  rule: >-
    Имя входит в один из корневых доменов и не попало ни под одно
    правило foreign.

foreign:
  # 1. Выпуск обслуживающей платформой. Не находка и не собственность
  #    компании в смысле управления сертификатом.
  infrastructure_providers:
    match_issuer_or_cname_any:
      - cloudflare
      - qrator
      - ddos-guard
      - selectel
      - yandexcloud
      - yandex-cloud
      - vk\.cloud
      - mcs\.mail\.ru
      - cloud\.ru
      - beget
      - timeweb
      - reg\.ru
      - nic\.ru
      - fastly
      - akamai
      - cloudfront
      - azureedge
      - googleusercontent
    reason: "Сертификат выпущен и управляется инфраструктурным провайдером"

  # 2. Сторонние SaaS на поддомене компании. Сертификатом управляет
  #    сервис, а не компания.
  saas_on_subdomain:
    match_cname_any:
      - \.zendesk\.com$
      - \.freshdesk\.com$
      - \.hubspot\.com$
      - \.statuspage\.io$
      - \.github\.io$
      - \.myshopify\.com$
      - \.bitrix24\.ru$
      - \.tilda\.ws$
      - \.wixdns\.net$
    reason: "Поддомен делегирован стороннему SaaS-сервису"

  # 3. Omni-SAN: сертификат хостера, где домен компании соседствует с
  #    чужими. Признак — много несвязанных registrable-доменов в одном SAN.
  omni_san:
    distinct_registrable_domains_gte: 5
    company_share_lte: 0.2
    reason: "Общий сертификат хостинг-провайдера на несвязанные домены"

unknown:
  # Сюда попадает всё, что не разметилось. Оператор разбирает только это.
  # Кандидаты, которые чаще всего оказываются здесь, — по опыту разбора
  # заполнить после первого прогона:
  #   - поддомены партнёров, дилеров, франчайзи
  #   - следы закрытых проектов и подрядчиков
  #   - имена, не резолвящиеся и ни на что не похожие
  hints: []

# Решения оператора на экране подтверждения дописываются сюда
# (требования, п. 2.3) и служат обучающей выборкой для автоматизации.
# Автоматизировать фильтр имеет смысл после 20-30 разобранных доменов.
operator_decisions_log: out/ownership_decisions.jsonl
